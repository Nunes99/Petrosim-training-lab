<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | PetroSim</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">PS</span>
      <div><strong>PetroSim</strong><small>Training Lab</small></div>
    </a>
  </header>
  <main class="auth-page">
    <form id="auth-form" class="simulation-form auth-card">
      <span class="eyebrow">Área do aluno</span>
      <h1 id="auth-title">Entrar</h1>
      <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
      <label>Senha<input id="password" type="password" minlength="8" autocomplete="current-password" required></label>
      <button id="auth-submit" class="button primary full-width" type="submit">Entrar</button>
      <button id="auth-mode" class="button secondary full-width" type="button">Criar uma conta</button>
      <p id="auth-message" class="form-message" role="status"></p>
    </form>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
